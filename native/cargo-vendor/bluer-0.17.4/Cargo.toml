    "id",
    "l2cap",
    "rfcomm",
    "mesh",
    "serde",
]
id = []
l2cap = []
mesh = ["bluetoothd"]
rfcomm = []
serde = [
    "uuid/serde",
    "dep:serde",
]

[lib]
name = "bluer"
path = "src/lib.rs"

