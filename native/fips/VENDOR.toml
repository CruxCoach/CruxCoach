# Provenance of the vendored FIPS crate.
#
# Everything in this directory except `VENDOR.toml` and `patches/` is upstream
# source at `commit`, with `patches/` applied in listed order and nothing else.
# `scripts/verify_vendored_fips.py` checks both halves of that claim; its
# offline mode runs in CI through `scripts/verify_vendored_fips_test.py`.
#
# Why vendored rather than a Git pin: `integration/platform` is a branch head,
# and a Cargo `rev =` pin stays reproducible only while that object survives
# upstream retention. The build must not depend on that. Vendoring also removes
# the network from the native build entirely.
#
# Why not a CruxCoach fork of jmcorgan/fips: no such fork exists, and creating
# one is an external repository this work has no authority to add. If one is
# created later, the migration is mechanical — move `patches/` onto an
# integration branch based on `commit` and point Cargo at that revision.

repository = "https://github.com/jmcorgan/fips"
# Reviewed platform-integration lineage. Head of `integration/platform` when
# vendored; recorded as an immutable commit, never as the branch name.
commit = "6580a806f9b05ee10497786f872fd65480ca8e5c"
commit_subject = "fix(node): compare a candidate address against the instance the peer is on"
commit_date = "2026-08-18"
license = "MIT"
# Superseded pin, kept for the rollback path (build the predecessor branch).
# `feat/board-cell-mesh-reliability` still declares it as a Cargo git revision,
# so that build depends on the upstream object still existing.
previous_commit = "967776079ba5ddc8fe118c3f289365b51eb03737"

# Both commits are additionally mirrored, outside upstream retention, in a bare
# repository on the operator/build host under these refs. That mirror is
# redundancy only, and its location is deliberately not recorded here: it is
# host state, not repository state. `commit` is fully reproducible from this
# repository alone; `previous_commit` is the one the mirror actually protects,
# because the predecessor branch still declares it as a Cargo git revision.
# Promoting the mirror somewhere durable off that host would mean creating an
# external repository, which is the project owner's decision.
archive_refs = [
    "refs/cruxcoach/fips/vendored-6580a80",
    "refs/cruxcoach/fips/superseded-pin-9677760",
]

# Upstream paths copied verbatim. `docs/`, `testing/`, `packaging/`,
# `examples/` and the nix flake are upstream tooling with no bearing on the
# Android library build; `benches/` is here only because `Cargo.toml` declares
# a `[[bench]]` target and the manifest is kept unmodified.
paths = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
    "rustfmt.toml",
    "benches",
    "src",
]

# Applied in order to a pristine checkout of `commit`.
patches = [
    "0001-node-restore-the-app-owned-identity-seam.patch",
    "0002-ble-share-advertised-psms-with-direct-reconnects.patch",
]

# sha256 over `"<sha256>  <path>\n"` lines for every vendored source file,
# sorted by path, excluding `VENDOR.toml` and `patches/`.
vendored_sha256 = "a958db5d2be7f6eaa9afe8a57ec043a6f8741199b102aefff2d597afcc98b984"
