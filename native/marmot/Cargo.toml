[package]
name = "cruxcoach-marmot"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[features]
default = ["mls"]
# The v2 MLS host over relays (MDK, nostr-sdk). Spike M0 builds the direct Olm
# channel alone with `--no-default-features` (size measurement only).
mls = [
  "dep:cgka-engine", "dep:cgka-session", "dep:cgka-traits", "dep:storage-sqlite",
  "dep:transport-nostr-peeler", "dep:transport-nostr-adapter", "dep:tokio", "dep:futures-util",
  "dep:rustls", "dep:webpki-roots", "dep:tokio-tungstenite", "dep:nostr-sdk",
  "dep:nostr-relay-builder", "dep:nostr-database", "dep:nostr-relay-pool", "dep:async-wsocket",
  "dep:sha2", "nostr/nip59",
]
local-harness = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cgka-engine = { path = ".mdk/crates/cgka-engine", optional = true }
cgka-session = { path = ".mdk/crates/cgka-session", optional = true }
fs-private = { path = ".mdk/crates/fs-private" }
cgka-traits = { path = ".mdk/crates/traits", optional = true }
storage-sqlite = { path = ".mdk/crates/storage-sqlite", optional = true }
transport-nostr-peeler = { path = ".mdk/crates/transport-nostr-peeler", optional = true }
transport-nostr-adapter = { path = ".mdk/crates/transport-nostr-adapter", optional = true }
nostr = { version = "=0.44.8", default-features = false, features = ["std", "nip44"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.52.1", features = ["rt", "rt-multi-thread", "time", "net", "macros", "sync", "io-util"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
hex = "=0.4.3"
jni = "=0.21.1"
zeroize = "=1.9.0"
futures-util = { version = "=0.3.32", optional = true }
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "=0.26.11", optional = true }
tokio-tungstenite = { version = "=0.26.2", features = ["rustls-tls-webpki-roots"], optional = true }
nostr-sdk = { version = "=0.44.1", default-features = false, optional = true }
nostr-relay-builder = { version = "=0.44.0", default-features = false, optional = true }
nostr-database = { version = "=0.44.0", default-features = false, optional = true }
nostr-relay-pool = { version = "=0.44.3", default-features = false, optional = true }
async-wsocket = { version = "=0.13.2", default-features = false, optional = true }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
# Olm channel (spike M0): audited Olm implementation, pinned by version and
# Cargo.lock checksum. The helpers below are the same RustCrypto generation
# vodozemac already pulls in, so the Olm path adds no second copy.
vodozemac = { version = "=0.11.0", default-features = false }
hmac = "=0.13.0"
hkdf = "=0.13.0"
sha2-v11 = { package = "sha2", version = "=0.11.0" }
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"

[dev-dependencies]
tempfile = "=3.27.0"
# Tests read message keys to prove they are gone from stored pickles.
vodozemac = { version = "=0.11.0", default-features = false, features = ["low-level-api"] }

[patch.crates-io]
hax-lib-macros = { git = "https://github.com/cryspen/hax.git", rev = "8f9cb576e58f6cc7e9ed249a7d4439b0f7ed0da7" }
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "5ae7fdf83085c595fd54f977b3a56ccacabaf16b" }

# Keep useful backtrace/module information without variable/type debug data
# or incremental scratch for the large pinned MDK graph. Test inherits dev;
# assertions and overflow checks must remain enabled. Release is unchanged.
[profile.dev]
debug = 1
incremental = false
debug-assertions = true
overflow-checks = true
