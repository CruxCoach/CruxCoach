# Memory-Limits für 12GB VM mit Ballooning
# Gradle Daemon: max 3GB (statt unbegrenzt)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Sequentiell bauen = weniger Peak-RAM
org.gradle.parallel=false
org.gradle.caching=true
# Daemon aus = kein Hintergrund-RAM-Verbrauch nach Build
org.gradle.daemon=false
# Max 2 Worker-Threads (statt CPU-count)
org.gradle.workers.max=1

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Kotlin Daemon: max 1.5GB (statt unbegrenzt)
kotlin.daemon.jvmargs=-Xmx2g
