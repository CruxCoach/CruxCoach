name: ONNX Runtime for the hold model

# Builds the reduced ONNX Runtime AAR the spray-wall hold model (FEAT-078) runs
# on, from the pinned ONNX Runtime release (tools/onnxruntime/build-android.sh).
# Started by hand, and in pull requests that change the build. The AAR and its
# SHA-256 come out as an artifact; publishing the AAR and pinning it in the app
# are separate, reviewed steps.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/onnxruntime/**
      - .github/workflows/onnxruntime-android.yml

permissions:
  contents: read

concurrency:
  group: onnxruntime-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q flatbuffers==25.12.19
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          cmake --version
      - name: Build the reduced ONNX Runtime
        run: tools/onnxruntime/build-android.sh "$RUNNER_TEMP/ort"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onnxruntime-android-reduced
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/ort/out/*.aar
            ${{ runner.temp }}/ort/out/SHA256SUMS
