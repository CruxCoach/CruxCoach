name: Publish verified feature APK

on:
  workflow_run:
    workflows: ['Feature APK request']
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  reserve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'feat/')
    runs-on: ubuntu-latest
    environment: apktrack-feature-publishing
    outputs:
      version_code: ${{ steps.reserve.outputs.version_code }}
      track: ${{ steps.identity.outputs.track }}
    steps:
      # Always check out trusted main before a credential-bearing step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Authorize feature maintainer
        env:
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          test -n "$ACTOR"
          grep -Fvx '#' .github/authorized-feature-maintainers.txt \
            | sed '/^[[:space:]]*$/d' \
            | grep -Fx -- "$ACTOR"
      - name: Derive immutable feature identity
        id: identity
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python3 scripts/feature_identity.py \
            --branch "$BRANCH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Reserve the next APKTrack development version
        id: reserve
        env:
          APKTRACK_FEATURE_TOKEN: ${{ secrets.APKTRACK_FEATURE_TOKEN }}
          APKTRACK_FIPS_TOKEN: ${{ secrets.APKTRACK_FIPS_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          TRACK: ${{ steps.identity.outputs.track }}
        run: |
          if [ "$TRACK" = fips ]; then
            APKTRACK_AGENT_TOKEN="$APKTRACK_FIPS_TOKEN"
          else
            APKTRACK_AGENT_TOKEN="$APKTRACK_FEATURE_TOKEN"
          fi
          test -n "$APKTRACK_AGENT_TOKEN"
          export APKTRACK_AGENT_TOKEN
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          project = "cruxcoach"
          track = os.environ["TRACK"]
          branch = os.environ["BRANCH"]
          commit = os.environ["COMMIT"].lower()
          query = urllib.parse.urlencode({
              "branch": branch,
              "commit": commit,
              "idempotency_key": f"{project}-{track}-{commit}",
              "minimum": 1_000_013,
          })
          url = (
              "https://stats.cruxcoach.org/apktrack/v2/versions/"
              f"{project}/{track}/reservations?{query}"
          )
          request = urllib.request.Request(
              url,
              method="POST",
              headers={"X-APKTrack-Token": os.environ["APKTRACK_AGENT_TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              reservation = json.load(response)
          code = int(reservation["version_code"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_code={code}\n")
          PY

  build:
    needs: reserve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Derive immutable feature identity
        id: identity
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 scripts/feature_identity.py --branch "$BRANCH" --github-output "$GITHUB_OUTPUT"
      - name: Test with reserved version
        env:
          FEATURE_BRANCH: ${{ steps.identity.outputs.branch }}
          FEATURE_TRACK: ${{ steps.identity.outputs.track }}
          FEATURE_PACKAGE: ${{ steps.identity.outputs.package }}
          FEATURE_LABEL: ${{ steps.identity.outputs.label }}
          FEATURE_VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
        run: |
          test "$FEATURE_TRACK" = "${{ needs.reserve.outputs.track }}"
          python3 -m unittest discover -s scripts -p '*_test.py'
          ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain \
            -PfeatureBranch="$FEATURE_BRANCH" \
            -PfeatureTrack="$FEATURE_TRACK" \
            -PfeaturePackage="$FEATURE_PACKAGE" \
            -PfeatureLabel="$FEATURE_LABEL" \
            -PfeatureVersionCode="$FEATURE_VERSION_CODE"
      - name: Install pinned Rust Android target
        run: rustup target add --toolchain 1.94.1 aarch64-linux-android
      - name: Build branch-specific APK
        env:
          FEATURE_BRANCH: ${{ steps.identity.outputs.branch }}
          FEATURE_TRACK: ${{ steps.identity.outputs.track }}
          FEATURE_PACKAGE: ${{ steps.identity.outputs.package }}
          FEATURE_LABEL: ${{ steps.identity.outputs.label }}
          FEATURE_VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
        run: |
          ./gradlew :androidApp:assembleDebug --console=plain \
            -PfeatureBranch="$FEATURE_BRANCH" \
            -PfeatureTrack="$FEATURE_TRACK" \
            -PfeaturePackage="$FEATURE_PACKAGE" \
            -PfeatureLabel="$FEATURE_LABEL" \
            -PfeatureVersionCode="$FEATURE_VERSION_CODE"
      - name: Bind artifact metadata
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          FEATURE_VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
        run: |
          python3 scripts/feature_identity.py \
            --branch "$BRANCH" \
            --write-metadata publication.json \
            --apk androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --commit "$COMMIT" \
            --version-code "$FEATURE_VERSION_CODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
            publication.json

  publish:
    needs: [reserve, build]
    runs-on: ubuntu-latest
    environment: apktrack-feature-publishing
    steps:
      # Never execute code or files from the feature checkout in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feature-apk
          path: feature-artifact
      - name: Verify branch, commit, identity, reserved version, and APK hash
        id: identity
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RESERVED_VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
        run: |
          python3 scripts/feature_identity.py \
            --branch "$BRANCH" \
            --verify-metadata feature-artifact/publication.json \
            --apk feature-artifact/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --commit "$COMMIT" \
            --github-output "$GITHUB_OUTPUT"
          test "$(python3 -c 'import json; print(json.load(open("feature-artifact/publication.json"))["version_code"])')" \
            = "$RESERVED_VERSION_CODE"
      - name: Install pinned APKTrack CLI
        env:
          WHEEL_URL: https://npub1uux22z2rhhcvk9fs9dp60k3uc5f7frdqy5chrsemsxwgnyl0y9dqhx0gem.nsite.lol/downloads/apktrack-0.2.0-py3-none-any.whl
          # Reproduced twice from reviewed APKTrack source at
          # 9bbb995b6968349b885a9d41d291835ffd97fd23 and
          # matched byte-for-byte against the public nsite artifact.
          WHEEL_SHA256: d8f40e6481ada6582290793a6f4759d236f3a0f5b95501ea5f52f7416bb4d736
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/apktrack-0.2.0-py3-none-any.whl" "$WHEEL_URL"
          echo "$WHEEL_SHA256  $RUNNER_TEMP/apktrack-0.2.0-py3-none-any.whl" | sha256sum --check --strict
          python3 -m pip install "$RUNNER_TEMP/apktrack-0.2.0-py3-none-any.whl"
      - name: Publish through APKTrack
        id: publish
        env:
          APKTRACK_FEATURE_TOKEN: ${{ secrets.APKTRACK_FEATURE_TOKEN }}
          APKTRACK_FIPS_TOKEN: ${{ secrets.APKTRACK_FIPS_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          TRACK: ${{ steps.identity.outputs.track }}
        run: |
          if [ "$TRACK" = fips ]; then
            APKTRACK_AGENT_TOKEN="$APKTRACK_FIPS_TOKEN"
          else
            APKTRACK_AGENT_TOKEN="$APKTRACK_FEATURE_TOKEN"
          fi
          test -n "$APKTRACK_AGENT_TOKEN"
          export APKTRACK_AGENT_TOKEN
          set -o pipefail
          apktrack publish-build \
            feature-artifact/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --config .apktrack/project.toml \
            --track "$TRACK" \
            --branch "$BRANCH" \
            --commit "$COMMIT" \
            | tee "$RUNNER_TEMP/apktrack-job.json"
          python3 - "$RUNNER_TEMP/apktrack-job.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          job = json.loads(open(sys.argv[1], encoding="utf-8").read())
          digest = job.get("release_sha256")
          if job.get("status") != "published" or job.get("receipt_delivered") is not True:
              raise SystemExit("APKTrack did not confirm a delivered publication receipt")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("APKTrack returned an invalid release SHA-256")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"release_sha256={digest}\n")
          PY
      - name: Download and verify centrally signed APK
        env:
          APKTRACK_URL: https://stats.cruxcoach.org/apktrack
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SHA256: ${{ steps.publish.outputs.release_sha256 }}
          TRACK: ${{ steps.identity.outputs.track }}
        run: |
          test -n "$RELEASE_SHA256"
          mkdir -p signed-artifact
          filename="CruxCoach-${TRACK}-${COMMIT:0:12}-signed.apk"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "signed-artifact/$filename" \
            "$APKTRACK_URL/v2/blobs/$RELEASE_SHA256"
          echo "$RELEASE_SHA256  signed-artifact/$filename" | sha256sum --check --strict
      - name: Store centrally signed APK on GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-${{ steps.identity.outputs.track }}-${{ github.event.workflow_run.head_sha }}
          path: signed-artifact/*.apk
          if-no-files-found: error
          retention-days: 90
