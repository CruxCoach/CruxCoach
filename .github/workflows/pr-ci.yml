name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Owner review: native integration, read-only CI; no signing/publisher token.
      - name: Install pinned Marmot toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android
      - name: Verify native Marmot boundary with local relays
        run: |
          python3 -m unittest discover -s native/marmot -p '*_test.py'
          python3 native/marmot/prepare.py
          cargo +1.97.1 fmt --manifest-path native/marmot/Cargo.toml --check
          cargo +1.97.1 test --locked --manifest-path native/marmot/Cargo.toml --features local-harness --test native_transport --test relay_boundary --test storage_boundary
      - name: Validate feature identity tooling
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain
      - name: Independent local Marmot participant processes
        run: |
          ./gradlew :androidApp:writeMarmotEndpointClasspath --console=plain
          cargo +1.97.1 build --locked --manifest-path native/marmot/Cargo.toml --example local_relay
          python3 scripts/marmot_network_e2e.py
      - name: Compile debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

  # The repository currently has legacy lint errors. Run the report in
  # parallel without delaying or blocking the required test/build gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android lint (advisory until legacy findings are baselined)
        continue-on-error: true
        run: ./gradlew :androidApp:lintDebug --console=plain
