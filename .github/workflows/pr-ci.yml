name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The repository's gradle.properties keeps Gradle and the Kotlin daemon at 2 GB for
      # small servers; on the runner (16 GB) the app's Kotlin compile ran out of memory in
      # that. The user home's gradle.properties wins over the project's, for CI only.
      - name: Give Gradle and the Kotlin daemon 4 GB
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g
          EOF
      - name: Validate feature identity tooling
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain
      - name: Compile debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

  # The repository currently has legacy lint errors. Run the report in
  # parallel without delaying or blocking the required test/build gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # As in the test job: 4 GB instead of the repository's 2 GB.
      - name: Give Gradle and the Kotlin daemon 4 GB
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g
          EOF
      - name: Android lint (advisory until legacy findings are baselined)
        continue-on-error: true
        run: ./gradlew :androidApp:lintDebug --console=plain
