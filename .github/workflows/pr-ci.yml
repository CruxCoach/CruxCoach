name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate feature identity tooling
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain
      - name: Install pinned Rust Android target
        run: rustup target add --toolchain 1.94.1 aarch64-linux-android
      - name: Compile debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

  # The repository currently has legacy lint errors. Run the report in
  # parallel without delaying or blocking the required test/build gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android lint (advisory until legacy findings are baselined)
        continue-on-error: true
        run: ./gradlew :androidApp:lintDebug --console=plain
