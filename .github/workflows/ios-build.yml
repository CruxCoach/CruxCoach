name: iOS build (unsigned)

# Credential-free: no secrets, no environments, no signing, no publisher.
# Produces UNSIGNED artifacts only. An unsigned .ipa proves the device target
# compiles and links; it does not prove that it installs or runs on a phone.
#
# Runs on STANDARD GitHub-hosted runners only (free for public repositories).
# Never switch these labels to a "large"/"xlarge" runner: those always bill.
on:
  push:
    branches:
      - 'feat/0.2.3-ios-parity'
      - 'feat/0.2.4-ios-parity'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Android side (shared + androidApp unit tests) is proven by the
  # "Feature APK request" run on every feat/** push; this job adds what only the
  # iOS branch has: the :appcore JVM tests and the generated-strings gate.
  appcore-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generated iOS strings are current
        run: python3 scripts/android_strings_to_ios.py --check
      - name: appcore unit tests
        run: ./gradlew :appcore:testDebugUnitTest --console=plain
      - name: Report failing tests
        if: failure()
        run: python3 scripts/ci_test_failures.py

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40
      - name: Kotlin/Native tests on the simulator
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test :appcore:iosSimulatorArm64Test --console=plain 2>&1 | tee "$RUNNER_TEMP/ci-knative.log"
      # Debug link: the release link of the Kotlin framework takes ~25 min on a standard runner.
      - name: Link CruxCoachCore.xcframework
        # Runs after an earlier failure too (the job still fails), so one CI round reports every
        # broken stage at once.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          iosApp/scripts/build-core.sh Debug 2>&1 | tee "$RUNNER_TEMP/ci-link.log"
      - name: Generate Xcode project
        # Runs after an earlier failure too (the job still fails), so one CI round reports every
        # broken stage at once.
        if: ${{ !cancelled() }}
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd iosApp && xcodegen generate
      # Simulator builds are signed ad hoc by Xcode ("sign to run locally", no identity, no secret);
      # without it the test host has no keychain entitlement and SecItem calls fail.
      - name: Build and run the unit tests on the simulator
        # Runs after an earlier failure too (the job still fails), so one CI round reports every
        # broken stage at once.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          DEVICE="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')"
          echo "Simulator: $DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          cd iosApp
          xcodebuild build-for-testing -project CruxCoach.xcodeproj -scheme CruxCoach \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/sim 2>&1 | tee "$RUNNER_TEMP/ci-sim.log" | tail -100
          xcodebuild test-without-building -project CruxCoach.xcodeproj -scheme CruxCoach \
            -destination "platform=iOS Simulator,name=$DEVICE" -only-testing:CruxCoachTests \
            -resultBundlePath "$RUNNER_TEMP/sim-unit.xcresult" \
            -derivedDataPath build/sim 2>&1 | tee -a "$RUNNER_TEMP/ci-sim.log" | tail -100
      - name: Build for device, unsigned
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cd iosApp && xcodebuild build -project CruxCoach.xcodeproj -scheme CruxCoach \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/ci-device.log" | tail -200
      # The IPA is packaged as soon as the app builds and its unit tests pass; the UI flows
      # below still decide whether the run is green.
      - name: Package unsigned IPA
        run: |
          cd iosApp
          APP="build/device/Build/Products/Release-iphoneos/CruxCoach.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          test -n "$VERSION"
          NAME="CruxCoach-${VERSION}-${GITHUB_SHA:0:12}-UNSIGNED.ipa"
          zip -qry "$NAME" Payload
          shasum -a 256 "$NAME" | tee "$NAME.sha256"
          lipo -info "Payload/CruxCoach.app/CruxCoach"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CruxCoach-iOS-UNSIGNED-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            iosApp/CruxCoach-*-UNSIGNED.ipa
            iosApp/CruxCoach-*-UNSIGNED.ipa.sha256
      # Optional variant for Apple Health: the same app signed ad hoc (no identity, no secret)
      # with its entitlements, so a re-signing sideload tool can see that it asks for HealthKit.
      # The unsigned IPA above stays the default.
      - name: Package ad-hoc variant with the HealthKit entitlement
        run: |
          cd iosApp
          rm -rf Adhoc && mkdir -p Adhoc/Payload
          cp -R "build/device/Build/Products/Release-iphoneos/CruxCoach.app" Adhoc/Payload/
          APP="Adhoc/Payload/CruxCoach.app"
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) -prune -print | while read -r item; do
            codesign --force --sign - --timestamp=none "$item"
          done
          codesign --force --sign - --timestamp=none --entitlements CruxCoach/CruxCoach.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          NAME="CruxCoach-${VERSION}-${GITHUB_SHA:0:12}-ADHOC-HEALTHKIT.ipa"
          (cd Adhoc && zip -qry "../$NAME" Payload)
          shasum -a 256 "$NAME" | tee "$NAME.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CruxCoach-iOS-ADHOC-HEALTHKIT-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            iosApp/CruxCoach-*-ADHOC-HEALTHKIT.ipa
            iosApp/CruxCoach-*-ADHOC-HEALTHKIT.ipa.sha256
      - name: UI flows on the simulator
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cd iosApp && xcodebuild test-without-building -project CruxCoach.xcodeproj -scheme CruxCoach \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" -only-testing:CruxCoachUITests \
            -resultBundlePath "$RUNNER_TEMP/sim-ui.xcresult" \
            -derivedDataPath build/sim 2>&1 | tee "$RUNNER_TEMP/ci-ui.log" | tail -100
      # Public summary of every simulator test (logs need a login, annotations do not),
      # and the UI flows' screenshots for the artifact.
      - name: Simulator test summary and screenshots
        if: always()
        run: |
          for bundle in "$RUNNER_TEMP/sim-unit.xcresult" "$RUNNER_TEMP/sim-ui.xcresult"; do
            test -d "$bundle" || continue
            python3 scripts/ci_xcresult_summary.py "$bundle" "$RUNNER_TEMP/screenshots"
          done
      # Job logs need admin rights on the repository; annotations are public.
      - name: Summarise failure
        if: failure()
        run: python3 scripts/ci_log_tail.py "$RUNNER_TEMP/ci-*.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CruxCoach-iOS-simulator-screenshots-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/screenshots/*.png
