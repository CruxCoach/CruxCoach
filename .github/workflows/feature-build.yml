name: Feature APK request

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: feature-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      # Trusted builds restore no Actions cache: community builds run fork code in the default-branch cache scope.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      # The repository's gradle.properties keeps Gradle and the Kotlin daemon at 2 GB for
      # small servers; on the runner (16 GB) the app's Kotlin compile ran out of memory in
      # that. The user home's gradle.properties wins over the project's, for CI only.
      - name: Give Gradle and the Kotlin daemon 4 GB
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g
          EOF
      - name: Derive immutable feature identity
        id: identity
        run: python3 scripts/feature_identity.py --branch "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Test
        env:
          FEATURE_BRANCH: ${{ steps.identity.outputs.branch }}
          FEATURE_TRACK: ${{ steps.identity.outputs.track }}
          FEATURE_PACKAGE: ${{ steps.identity.outputs.package }}
          FEATURE_LABEL: ${{ steps.identity.outputs.label }}
          # This job has no publication credentials. The trusted follow-up
          # reserves the publishable versionCode atomically in APKTrack.
          FEATURE_VERSION_CODE: '1000013'
        run: |
          python3 -m unittest discover -s scripts -p '*_test.py'
          ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain \
            -PfeatureBranch="$FEATURE_BRANCH" \
            -PfeatureTrack="$FEATURE_TRACK" \
            -PfeaturePackage="$FEATURE_PACKAGE" \
            -PfeatureLabel="$FEATURE_LABEL" \
            -PfeatureVersionCode="$FEATURE_VERSION_CODE"
