name: CruxCoach UI Flows

# Maestro workspace config. UI copy is deliberately exercised on the German
# fixture device; locale-independent formatting/resource behavior is covered
# by the Android JVM resource suite.
#
# Run all:
#     dmaestro test flows/
#
# Run only smoke:
#     dmaestro test --include-tags=smoke flows/
#
# Run all *except* mutating flows:
#     dmaestro test --exclude-tags=mutates-state flows/

executionOrder:
  flowsOrder:
    - smoke
    - browser-search
    - browser-filter-sheet
    - detail-open
    - search-result-opens-correct-climb
    - editor-open
    - editor-overflow
    - drafts-drawer-open
    - settings-navigate
    - map-navigate
    - settings-board-picker
    - lists-navigate
    # Mutating flows run last and normalize the state they own on entry.
    - climb-type-filter-changes-list
    - detail-favorite-toggle
    - detail-favorite-persists
    - detail-add-to-list
