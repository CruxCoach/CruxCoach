appId: com.cruxcoach.android
name: subflow-reset-browser-filters
---
- runFlow: launch-browser.yaml
- tapOn: "Filter"
# A text button, or an icon with the same description on narrow screens and
# at large font sizes.
- assertVisible: "Zurücksetzen"
- tapOn: "Zurücksetzen"
- pressKey: Back
- assertVisible: "Filter"
- extendedWaitUntil:
    visible: "[0-9]+ Begehung(en)?"
    timeout: 30000
