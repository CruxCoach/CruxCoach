appId: com.cruxcoach.android
name: subflow-cleanup-legacy-logbook
---
- runFlow: open-logbook.yaml
# The fixture timestamps are deliberately in the future, so any residue from
# an interrupted earlier run is in the first viewport. Select only fixture
# entries, by the checkbox of their climb name ("<climb> auswählen"); never use
# Select All, which could remove unrelated test-phone logbook data.
- runFlow:
    when:
      visible: "E2E Legacy 0\\.1\\.4 .* auswählen"
    commands:
      - runFlow:
          when:
            visible: "E2E Legacy 0\\.1\\.4 Five Star auswählen"
          commands:
            - tapOn: "E2E Legacy 0\\.1\\.4 Five Star auswählen"
      - runFlow:
          when:
            visible: "E2E Legacy 0\\.1\\.4 Four Star auswählen"
          commands:
            - tapOn: "E2E Legacy 0\\.1\\.4 Four Star auswählen"
      - runFlow:
          when:
            visible: "E2E Legacy 0\\.1\\.4 Unrated auswählen"
          commands:
            - tapOn: "E2E Legacy 0\\.1\\.4 Unrated auswählen"
      # The oldest fixture row can sit at the screen edge, under the system
      # bar: scroll it fully into view before tapping its checkbox.
      - scrollUntilVisible:
          element: "E2E Legacy 0\\.1\\.4 Attempt auswählen"
          direction: DOWN
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: "E2E Legacy 0\\.1\\.4 Attempt auswählen"
          commands:
            - tapOn: "E2E Legacy 0\\.1\\.4 Attempt auswählen"
      - runFlow: logbook-delete-selected.yaml
      - extendedWaitUntil:
          notVisible: "E2E Legacy 0\\.1\\.4 .* auswählen"
          timeout: 10000
- pressKey: Back
- assertVisible: "Filter"
