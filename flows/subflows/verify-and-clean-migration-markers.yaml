appId: com.cruxcoach.android
name: subflow-verify-and-clean-migration-markers
---
# The run-scoped ascent and its favorite entity both crossed the upgrade.
# Matchers are German labels and content descriptions: Compose test tags do
# not surface as resource ids (docs/testing.md). The logbook shows a comment
# in quotes, so the marker is matched as part of its text.
- runFlow: logbook-open-by-label.yaml
- extendedWaitUntil:
    visible: ".*E2E-MIGRATION-${E2E_MIGRATION_MARKER}.*"
    timeout: 15000
- assertVisible: "Top · 3 Versuche"
- assertVisible: "4★"
- tapOn: ".*E2E-MIGRATION-${E2E_MIGRATION_MARKER}.*"
- extendedWaitUntil:
    visible: "Von Favoriten entfernen"
    timeout: 15000
# Exact UI cleanup of both markers before the host's final package clear.
- tapOn: "Von Favoriten entfernen"
- assertVisible: "Zu Favoriten hinzufügen"
- pressKey: Back
- runFlow: delete-first-logbook-entry.yaml
- extendedWaitUntil:
    notVisible: ".*E2E-MIGRATION-${E2E_MIGRATION_MARKER}.*"
    timeout: 10000
- pressKey: Back
- assertVisible: "Filter"
