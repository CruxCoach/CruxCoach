appId: com.cruxcoach.android
name: backup-import-legacy
tags:
  - release-gate
  - extended
  - mutates-state
---
# Public-safe, deterministic derivative of a genuine 0.1.4 export. This one
# flow covers preview, cross-account consent, the 4/5-star write regression,
# persisted logbook/list state, idempotent re-import, and precise cleanup.

# Setup cleanup makes a previous interrupted run unable to invert the result.
- runFlow: subflows/cleanup-legacy-logbook.yaml

# First import: exact historical preview and write result.
- runFlow: subflows/open-data-import.yaml
- runFlow: subflows/pick-legacy-backup.yaml
- tapOn:
    id: "import_confirm"
- extendedWaitUntil:
    visible:
      id: "import_pick_file"
    timeout: 30000
- assertVisible:
    text: ".*(Imported|Importiert):.*3 .*Sends.*1 .*Versuche|.*(Imported|Importiert):.*3 .*sends.*1 .*bids.*"
- assertNotVisible:
    text: ".*(out of range|invalid backup|not finite|ungültig|fehlgeschlagen|failed).*"
- tapOn:
    id: "data_import_back"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"

# Independent persisted-state proof: each rating and angle is bound to its
# fixture row by position instead of accepting unrelated text elsewhere
# onscreen. The fixture rows are the newest of the logbook (2099), in the
# order Five Star, Four Star, Unrated, Attempt, so a value above the next
# fixture's climb name belongs to the row before it.
- runFlow: subflows/logbook-open-by-label.yaml
- extendedWaitUntil:
    visible: "E2E Legacy 0\\.1\\.4 Five Star"
    timeout: 15000
- assertVisible:
    text: "5★"
    above: "E2E Legacy 0\\.1\\.4 Four Star"
- assertVisible:
    text: "40°"
    below: "E2E Legacy 0\\.1\\.4 Five Star"
    above: "E2E Legacy 0\\.1\\.4 Four Star"
- assertVisible:
    text: "4★"
    below: "E2E Legacy 0\\.1\\.4 Five Star"
    above: "E2E Legacy 0\\.1\\.4 Unrated"
- assertVisible: "E2E Legacy 0\\.1\\.4 Unrated"
# The attempt row can sit below the first screen.
- scrollUntilVisible:
    element: "E2E Legacy 0\\.1\\.4 Attempt"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "(Offen · 3 Versuche|Open · 3 attempts)"
    below: "E2E Legacy 0\\.1\\.4 Unrated"
- pressKey: Back
- tapOn:
    id: "board_lists_button"
- scrollUntilVisible:
    element:
      text: "e2e_legacy_014_alpha"
    direction: DOWN
- assertVisible: "e2e_legacy_014_alpha"
- assertVisible: "e2e_legacy_014_beta"
- pressKey: Back

# Re-import the identical bytes. Structured Logcat expectations prove that no
# log rows were inserted, exactly four primary-key duplicates were skipped,
# and the two lists were merged rather than duplicated.
- runFlow: subflows/open-data-import.yaml
- runFlow: subflows/pick-legacy-backup.yaml
- tapOn:
    id: "import_confirm"
- extendedWaitUntil:
    visible:
      id: "import_pick_file"
    timeout: 30000
- assertVisible:
    text: ".*2 (lists|Listen).*4 (duplicates skipped|Duplikate übersprungen).*"
- tapOn:
    id: "data_import_back"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"

# Teardown removes only the four fixture UUIDs and two clearly named custom
# lists. The runner separately removes the exact staged Downloads file.
- runFlow: subflows/cleanup-legacy-logbook.yaml
- tapOn:
    id: "board_lists_button"
- scrollUntilVisible:
    element:
      id: "board_list_delete_e2e_legacy_014_alpha"
    direction: DOWN
- tapOn:
    id: "board_list_delete_e2e_legacy_014_alpha"
- assertVisible:
    id: "board_list_delete_dialog"
- tapOn:
    id: "board_list_delete_confirm"
- extendedWaitUntil:
    notVisible: "e2e_legacy_014_alpha"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "board_list_delete_e2e_legacy_014_beta"
    direction: DOWN
- tapOn:
    id: "board_list_delete_e2e_legacy_014_beta"
- assertVisible:
    id: "board_list_delete_dialog"
- tapOn:
    id: "board_list_delete_confirm"
- extendedWaitUntil:
    notVisible: "e2e_legacy_014_beta"
    timeout: 10000
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"

