appId: com.cruxcoach.android
name: climb-type-filter-changes-list
tags:
  - release-gate
  - smoke
  - mutates-state
---
# BEHAVIOUR test: filter-pipeline end-to-end. Toggling the
# climb-type filter from BOULDER (default) to ROUTE flips the
# kind of cards visible in the browser:
#   - boulders carry "X Züge" (move-counter, board_climb_moves)
#   - routes carry "X Frames" (frame-counter, board_climb_frames)
#
# Strategy: assert Züge visible (default), switch filter, assert
# Frames visible AND Züge no longer visible, switch back, restore
# Züge. Catches a regression in any layer of the filter chain:
# UI tap → ViewModel.updateClimbTypeFilter → Repository query →
# climb_browse VIEW → adapter render.
#
# FILTER-STATE precondition: defaults. The flow itself is fully
# self-contained — it sets and resets the climb-type filter
# explicitly. Other filters are not touched.
- runFlow: subflows/reset-browser-filters.yaml
# Sanity: boulder default → "X Züge" cards visible.
- assertVisible:
    text: "[0-9]+ Züge"
# Switch to Routes.
- tapOn:
    id: "board_filter_toggle"
- scrollUntilVisible:
    element:
      id: "board_type_route"
    direction: DOWN
- tapOn:
    id: "board_type_route"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
# Routes mode → "X Frames" cards, NO "X Züge".
- extendedWaitUntil:
    visible:
      text: "[0-9]+ Frames"
    timeout: 15000
- assertNotVisible:
    text: "[0-9]+ Züge"
# Restore default boulder filter.
- tapOn:
    id: "board_filter_toggle"
- scrollUntilVisible:
    element:
      id: "board_type_boulder"
    direction: DOWN
- tapOn:
    id: "board_type_boulder"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
- extendedWaitUntil:
    visible:
      text: "[0-9]+ Züge"
    timeout: 15000
- assertNotVisible:
    text: "[0-9]+ Frames"
