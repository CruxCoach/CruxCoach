appId: com.cruxcoach.android
name: search-result-opens-correct-climb
tags:
  - release-gate
  - smoke
---
# BEHAVIOUR test: a result reached through search routes to the correct UUID and
# detail-loads the tapped climb. The negative-search root separately proves that
# the query reduces the result set. This root catches:
# - card-onClick wired to the wrong uuid
# - detail screen loading a different climb than the tap target
#
# Capture a current catalogue entity instead of pinning a remote name/count.
- runFlow: subflows/reset-browser-filters.yaml
- copyTextFrom:
    id: "board_climb_name"
    index: 0
- evalScript: ${output.searchTarget = maestro.copiedText}
- tapOn:
    id: "board_search_fab"
- tapOn:
    id: "board_search_field"
- inputText: ${output.searchTarget}
- extendedWaitUntil:
    visible: ${output.searchTarget}
    timeout: 15000
# The tagged card surface is the intended clickable node, never its setter link.
- tapOn:
    id: "board_climb_card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "boarddetail_name"
    timeout: 15000
- assertVisible: ${output.searchTarget}
- assertVisible:
    id: "boarddetail_visualization"
- pressKey: Back
- tapOn:
    id: "board_search_field"
- eraseText: 200
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "board_climb_card"
    timeout: 15000
- tapOn:
    id: "board_search_fab"
- assertNotVisible:
    id: "board_search_field"
