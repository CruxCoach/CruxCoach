appId: com.cruxcoach.android
name: settings-board-picker
tags:
  - release-gate
  - smoke
---
- runFlow: subflows/launch-browser.yaml
- tapOn:
    id: "board_settings_button"
# Settings landing — same stable anchor as settings-navigate.
- scrollUntilVisible:
    element:
      id: "settings_section_board"
    direction: DOWN
# Open the FEAT-007 board-model dialog via the "Ändern" button next to
# the "Board-Größe" row. The label "Ändern" appears only on this row
# in the visible Settings viewport (other change buttons in the
# expanded settings list are below the fold).
- tapOn:
    id: "settings_section_board"
- tapOn:
    id: "settings_board_change"
- waitForAnimationToEnd:
    timeout: 2000
# Dialog title is uniquely worded so it can't be confused with any
# other modal in the app.
- assertVisible:
    id: "board_picker_dialog"
# Cancel — the dialog supports an explicit dismiss button labelled
# "Schließen" (action_close).
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
# Back on the Settings landing.
- assertVisible:
    id: "settings_section_board"
- pressKey: Back
# Back on the BoardBrowser.
- assertVisible:
    id: "board_filter_toggle"
