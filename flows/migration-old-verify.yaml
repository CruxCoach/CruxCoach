appId: com.cruxcoach.android
name: migration-old-verify
tags:
  - extended
  - upgrade
  - manual-prereq
  - mutates-state
---
# Host precondition: matching-signer 0.2.2 was installed in place over the
# completed v0.1.4 or v0.2.0 predecessor setup. This transition is one-shot.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "whatsnew_021_dialog"
    timeout: 15000
- assertVisible: "Neu in 0.2.1"
- assertNotVisible: "Neu in 0.2.2"
- pressKey: Back
- assertVisible:
    id: "whatsnew_021_dialog"
- tapOn:
    point: "3%,50%"
- assertVisible:
    id: "whatsnew_021_dialog"
- tapOn:
    id: "whatsnew_021_confirm"
- extendedWaitUntil:
    visible:
      id: "whatsnew_022_dialog"
    timeout: 10000
- assertVisible: "Neu in 0.2.2"
- assertNotVisible: "Neu in 0.2.1"
- pressKey: Back
- assertVisible:
    id: "whatsnew_022_dialog"
- tapOn:
    point: "3%,50%"
- assertVisible:
    id: "whatsnew_022_dialog"
- tapOn:
    id: "whatsnew_022_confirm"
- assertVisible:
    id: "board_filter_toggle"
- assertNotVisible: "Willkommen bei CruxCoach"
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "whatsnew_021_dialog"
- assertNotVisible:
    id: "whatsnew_022_dialog"
- assertVisible:
    id: "board_filter_toggle"
- runFlow: subflows/verify-and-clean-migration-markers.yaml
