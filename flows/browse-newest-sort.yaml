appId: com.cruxcoach.android
name: browse-newest-sort
tags:
  - release-gate
  - extended
  - mutates-state
---
- runFlow: subflows/reset-browser-filters.yaml
- tapOn:
    id: "board_filter_toggle"
- scrollUntilVisible:
    element:
      id: "board_sort_newest"
    direction: DOWN
- tapOn:
    id: "board_sort_newest"
- assertVisible:
    id: "board_sort_newest"
    checked: true
- assertVisible: "Absteigend"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "board_climb_card"
- tapOn:
    id: "board_filter_toggle"
- scrollUntilVisible:
    element:
      id: "board_sort_direction"
    direction: DOWN
- tapOn:
    id: "board_sort_direction"
- assertVisible: "Aufsteigend"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "board_climb_card"
# Flip back. The companion sort-proof audits the emitted UUID/timestamp sequence
# as NEWEST DESC/ASC/DESC and proves exact restoration without label ambiguity.
- tapOn:
    id: "board_filter_toggle"
- scrollUntilVisible:
    element:
      id: "board_sort_direction"
    direction: DOWN
- tapOn:
    id: "board_sort_direction"
- assertVisible: "Absteigend"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "board_climb_card"
# Cleanup all browser filters/sort to defaults.
- tapOn:
    id: "board_filter_toggle"
- tapOn:
    id: "board_filter_reset"
- pressKey: Back
- assertVisible:
    id: "board_climb_card"
