appId: com.cruxcoach.android
name: detail-open
tags:
  - release-gate
  - smoke
---
# Tap a climb card and verify navigation lands on the climb-detail
# screen — NOT a SetterDetail screen. Tap target is the per-card
# "X Züge" move-counter text, which has no own click handler so it
# tap-propagates to Card.onClick (the climb-detail navigation).
# Behavioural verification: see detail-open.expects file with PERF
# NAV markers — the strongest signal that the right composable was
# entered, not a similar-looking sibling.
- runFlow: subflows/open-first-climb.yaml
# Detail-screen unique landmarks: back-arrow ("Zurück") and BLE icon
# content-desc "Board verbinden" (browser uses "Bluetooth" for the
# same icon, so the co-occurrence pins us on detail).
- assertVisible:
    id: "boarddetail_back_button"
- assertVisible:
    id: "boarddetail_ble_connect_button"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
