appId: com.cruxcoach.android
name: logbook-honest-flash-and-stats
tags:
  - release-gate
  - extended
  - mutates-state
---
# Matchers are German texts and content descriptions (config.yaml): Compose
# test tags do not surface as resource ids (docs/testing.md), and the logbook
# tags of 0.2.2 are gone. The shared launch and open subflows still use them,
# so this root launches and navigates by labels on its own. The logbook shows
# a comment in quotes, so the markers are matched as part of their text.
#
# Infrastructure attempts share E2E_RUN_ID. Pre-clean only markers from a
# possible prior attempt so replay cannot change the first-contact semantics.
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "Zulassen"
    commands:
      - tapOn: "Zulassen"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Filter"
    timeout: 30000
- runFlow: subflows/logbook-open-by-label.yaml
- runFlow:
    when:
      visible: ".*E2E-HONEST-SEND-${E2E_RUN_ID}.*"
    commands:
      - tapOn:
          text: ".+ auswählen"
          index: 0
      - runFlow: subflows/logbook-delete-selected.yaml
- runFlow:
    when:
      visible: ".*E2E-HONEST-ATTEMPT-${E2E_RUN_ID}.*"
    commands:
      - tapOn:
          text: ".+ auswählen"
          index: 0
      - runFlow: subflows/logbook-delete-selected.yaml
- tapOn: "Zurück"
# First contact: an open project with three attempts on the first climb of
# the list. The send count has no click of its own, so the tap opens the card.
- extendedWaitUntil:
    visible: "[0-9]+ Begehung(en)?"
    timeout: 30000
- tapOn:
    text: "[0-9]+ Begehung(en)?"
    index: 0
- extendedWaitUntil:
    visible: "Weitere Optionen"
    timeout: 15000
- assertNotVisible: "Climb konnte nicht geladen werden"
- tapOn: "Weitere Optionen"
- tapOn: "Mit Details loggen…"
- tapOn: "Versuch"
- tapOn: "Versuchsanzahl erhöhen"
- tapOn: "Versuchsanzahl erhöhen"
- tapOn: "Kommentar \\(optional\\)"
- inputText: "E2E-HONEST-ATTEMPT-${E2E_RUN_ID}"
- hideKeyboard
- tapOn: "Speichern"
# Later first-try send at the same climb+angle: must not become a Flash.
- tapOn: "Weitere Optionen"
- tapOn: "Mit Details loggen…"
- tapOn: "Send"
- tapOn: "Kommentar \\(optional\\)"
- inputText: "E2E-HONEST-SEND-${E2E_RUN_ID}"
- hideKeyboard
- tapOn: "Speichern"
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Filter"
    timeout: 30000
- runFlow: subflows/logbook-open-by-label.yaml
# The overview on top of the logbook: the last 30 days hold at least the
# climbing day and the send just logged. Existing unrelated logbook rows may
# increase the values, so these assertions prove lower bounds instead of
# pinning disposable-device totals.
# The overview grows in once the whole logbook is read: several seconds for
# a long one on a mid-range phone.
- extendedWaitUntil:
    visible: "Auf einen Blick"
    timeout: 30000
- assertVisible: "Letzte 30 Tage"
- assertVisible: "Klettertage, [1-9][0-9]*(, .*)?"
- assertVisible: "Begehungen, [1-9][0-9]*(, .*)?"
- scrollUntilVisible:
    element: ".*E2E-HONEST-ATTEMPT-${E2E_RUN_ID}.*"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*E2E-HONEST-SEND-${E2E_RUN_ID}.*"
- assertVisible: "Offen · 3 Versuche"
- assertVisible: "Top · 1. Versuch"
# The send's result stands above its comment; older flashes further down the
# list do not count.
- assertNotVisible:
    text: "Flash"
    above: ".*E2E-HONEST-SEND-${E2E_RUN_ID}.*"
# The day's recap opens and can be shared.
- tapOn: "Session-Rückblick, .*"
- extendedWaitUntil:
    visible: "Als Bild teilen"
    timeout: 10000
- pressKey: Back
# The statistics of the whole logbook: the six numbers hold the controlled
# attempt and send. The period and grade math stay exact in
# BoardStatsComputerTest. The year in review's card above the filters can
# push the six numbers to the bottom of the screen: their last row is brought
# to the middle, so the bests below them are on screen when drawn.
- tapOn: "Statistiken"
- scrollUntilVisible:
    element: "Boulder, [1-9][0-9]*(, .*)?"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: "Begehungen, [1-9][0-9]*(, .*)?"
- assertVisible: "Versuche, [1-9][0-9]*(, .*)?"
- assertVisible: "Klettertage, [1-9][0-9]*(, .*)?"
# The period's bests need history: a best of one is none, climbing days per
# week need a period of two weeks, a streak two weeks in a row. On a phone
# with only this flow's entries the section is not drawn, so each best is
# checked where it is shown; its rules are tested in BoardStatsComputerTest.
# The bests share their labels with the overview's chips, so they are found
# below their heading.
- runFlow:
    when:
      visible: "Bestwerte im Zeitraum"
    commands:
      - runFlow:
          when:
            visible:
              text: "Begehungen an einem Tag, .*"
              below: "Bestwerte im Zeitraum"
          commands:
            - assertVisible:
                text: "Begehungen an einem Tag, ([2-9]|[1-9][0-9]+)(, .*)?"
                below: "Bestwerte im Zeitraum"
      - runFlow:
          when:
            visible:
              text: "Klettertage pro Woche, .*"
              below: "Bestwerte im Zeitraum"
          commands:
            - assertVisible:
                text: "Klettertage pro Woche, [0-9]+,[0-9]"
                below: "Bestwerte im Zeitraum"
      - runFlow:
          when:
            visible:
              text: "Wochen in Folge, .*"
              below: "Bestwerte im Zeitraum"
          commands:
            - assertVisible:
                text: "Wochen in Folge, ([2-9]|[1-9][0-9]+)"
                below: "Bestwerte im Zeitraum"
- scrollUntilVisible:
    element: "Boulder je Grad"
    direction: DOWN
    timeout: 10000
- pressKey: Back
# Cleanup exactly the two entries created above: the newest two of the list.
- scrollUntilVisible:
    element: ".*E2E-HONEST-ATTEMPT-${E2E_RUN_ID}.*"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ".+ auswählen"
    index: 0
- tapOn:
    text: ".+ auswählen"
    index: 1
- runFlow: subflows/logbook-delete-selected.yaml
- extendedWaitUntil:
    notVisible: ".*E2E-HONEST-SEND-${E2E_RUN_ID}.*"
    timeout: 10000
- assertNotVisible: ".*E2E-HONEST-ATTEMPT-${E2E_RUN_ID}.*"
- tapOn: "Zurück"
- assertVisible: "Filter"
