appId: com.cruxcoach.android
name: map-navigate
tags:
  - release-gate
  - smoke
---
- runFlow: subflows/launch-browser.yaml
# The map action lives in the browser's expandable search/action row.
- tapOn:
    id: "board_search_fab"
- assertVisible:
    id: "board_map_button"
- tapOn:
    id: "board_map_button"
- waitForAnimationToEnd:
    timeout: 5000
# Top-level Map screen: the "Karte" top-bar title is shared with no
# other route in the DE UI. Pair with the filter / stats action
# contentDescriptions (icon-only buttons on the AppBar) to disambiguate.
- assertVisible: "Karte"
- assertVisible: "Filter öffnen"
- assertVisible: "Statistik öffnen"
- pressKey: Back
# We should be back on the BoardBrowser; "Filter" is the browser's
# filter-chips header, the same anchor the settings-navigate flow uses.
- assertVisible:
    id: "board_filter_toggle"
- runFlow:
    when:
      visible:
        id: "board_search_field"
    commands:
      - tapOn:
          id: "board_search_fab"
- assertNotVisible:
    id: "board_search_field"
