appId: com.cruxcoach.android
name: map-navigate
tags:
  - release-gate
  - smoke
---
- runFlow: subflows/launch-browser.yaml
# The map action lives in the browser's expandable search/action row.
- tapOn:
    id: "board_search_fab"
- assertVisible:
    id: "board_map_button"
- tapOn:
    id: "board_map_button"
- waitForAnimationToEnd:
    timeout: 5000
# Map screen: floating search bar with the board and filter chips on top,
# the stats action is the icon-only button in the search bar.
- assertVisible:
    id: "map_search_field"
- assertVisible:
    id: "map_brand_chip"
- assertVisible:
    id: "map_filters_chip"
- assertVisible: "Statistik öffnen"
# The bottom sheet lists the places in the visible part of the map.
- assertVisible:
    id: "map_in_view_title"
- pressKey: Back
# We should be back on the BoardBrowser; "Filter" is the browser's
# filter-chips header, the same anchor the settings-navigate flow uses.
- assertVisible:
    id: "board_filter_toggle"
- runFlow:
    when:
      visible:
        id: "board_search_field"
    commands:
      - tapOn:
          id: "board_search_fab"
- assertNotVisible:
    id: "board_search_field"
