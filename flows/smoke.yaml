appId: com.cruxcoach.android
name: smoke
tags:
  - release-gate
  - smoke
---
# Cold-start smoke: browser route plus a populated, tagged catalogue card.
# launch-browser deliberately restarts the process so smoke.expects observes
# evidence from this root rather than from whichever root ran before it.
- runFlow: subflows/launch-browser.yaml
- assertVisible:
    id: "board_filter_toggle"
- assertVisible:
    id: "board_create_fab"
- assertVisible:
    id: "board_lists_button"
- assertVisible:
    id: "board_climb_card"
