appId: com.cruxcoach.android
name: smoke
tags:
  - smoke
---
# App-Smoke: launches the app, asserts the Browser is the landing
# screen by checking landmarks unique to the Browser. Combined with
# the logcat .expects file, verifies UI + behavioural state at
# startup. Locale: DE — phone is DE-locale by default.
- launchApp
# Cold-start splash + initial query takes up to ~3s on this device.
# Asserts below have an implicit 5s poll, so a single wait here is
# enough; downstream taps/asserts don't need their own waits.
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Filter"
- assertVisible: "Neuen Climb erstellen"
- assertVisible: "Meine Listen"
# At least one climb-card visible.
- assertVisible:
    text: "[0-9]+ Züge"
