appId: com.cruxcoach.android
name: smoke
tags:
  - smoke
---
# App-Smoke: launches the app, asserts the Browser is the landing
# screen by checking three landmarks that are *only* present when the
# Browser composable is actually mounted (the app remembers the last
# screen across cold starts, so launching could otherwise resume into
# Settings/Detail/etc.). Combined with the logcat .expects file,
# verifies both UI and behavioural state at startup.
#
# Locale: assertions in DE — phone is DE-locale by default.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# TopAppBar landmarks unique to the Browser screen.
- assertVisible: "Filter"
- assertVisible: "Neuen Climb erstellen"
- assertVisible: "Meine Listen"
# At least one climb-card is visible — pattern matches the
# "X Züge" (X moves) line each card carries on a boulder problem.
- assertVisible:
    text: "[0-9]+ Züge"
