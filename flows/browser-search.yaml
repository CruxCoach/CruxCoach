appId: com.cruxcoach.android
name: browser-search
tags:
  - release-gate
  - smoke
---
# Verify the real filter pipeline against the stable no-results state, then
# restore both query and search-overlay state on a normal pass.
- runFlow: subflows/reset-browser-filters.yaml
- tapOn:
    id: "board_search_fab"
- tapOn:
    id: "board_search_field"
- inputText: "E2E-NO-MATCH-${E2E_RUN_ID}"
- extendedWaitUntil:
    visible:
      id: "board_empty_clear_filters"
    timeout: 15000
- assertVisible:
    id: "board_empty_state"
- assertNotVisible:
    id: "board_climb_card"
- tapOn:
    id: "board_search_field"
- eraseText: 100
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "board_climb_card"
    timeout: 15000
- assertNotVisible:
    id: "board_empty_state"
- tapOn:
    id: "board_search_fab"
- assertNotVisible:
    id: "board_search_field"
