appId: com.cruxcoach.android
name: editor-overflow
tags:
  - smoke
---
# Verify the editor's ⋮ overflow menu has the expected items. Covers
# commit 90ee6e7 which moved Drafts + Heatmap from direct TopBar
# icons into the menu.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Neuen Climb erstellen"
- assertVisible: "Neuer Climb"
- tapOn: "Weitere Optionen"
- assertVisible: "Entwürfe öffnen"
- assertVisible: "Heatmap (häufige Griffe) ein/aus"
- pressKey: Back
- assertVisible: "Neuer Climb"
- pressKey: Back
- assertVisible: "Filter"
