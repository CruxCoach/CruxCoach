appId: com.cruxcoach.android
name: logbook-create-send
tags:
  - release-gate
  - extended
  - mutates-state
---
# Matchers are German labels and content descriptions (config.yaml): Compose
# test tags do not surface as resource ids (docs/testing.md). The logbook
# shows a comment in quotes, so the marker is matched as part of its text.
#
# A transport retry reuses E2E_RUN_ID. Remove at most the immediately prior
# attempt's run-scoped marker before writing it again, then leave Logbook.
- runFlow: subflows/launch-browser.yaml
- runFlow: subflows/logbook-open-by-label.yaml
- runFlow:
    when:
      visible: ".*E2E-SEND-${E2E_RUN_ID}.*"
    commands:
      - runFlow: subflows/delete-first-logbook-entry.yaml
      - extendedWaitUntil:
          notVisible: ".*E2E-SEND-${E2E_RUN_ID}.*"
          timeout: 10000
- pressKey: Back
- runFlow: subflows/open-first-climb.yaml
- tapOn: "Weitere Optionen"
- tapOn: "Mit Details loggen…"
- assertVisible: "Kletterergebnis erfassen"
- tapOn: "Send"
- tapOn: "Versuchsanzahl erhöhen"
- tapOn: "Versuchsanzahl erhöhen"
- tapOn: "4 Sterne"
- tapOn: "Kommentar \\(optional\\)"
- inputText: "E2E-SEND-${E2E_RUN_ID}"
- hideKeyboard
- tapOn: "Speichern"
- assertNotVisible: "Kletterergebnis erfassen"
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Filter"
    timeout: 30000
- runFlow: subflows/logbook-open-by-label.yaml
- extendedWaitUntil:
    visible: ".*E2E-SEND-${E2E_RUN_ID}.*"
    timeout: 15000
- assertVisible: "Top · 3 Versuche"
- assertVisible: "4★"
- assertVisible: "40°"
- runFlow: subflows/delete-first-logbook-entry.yaml
- extendedWaitUntil:
    notVisible: ".*E2E-SEND-${E2E_RUN_ID}.*"
    timeout: 10000
- pressKey: Back
- assertVisible: "Filter"
