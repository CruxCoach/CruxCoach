appId: com.cruxcoach.android
name: settings-navigate
tags:
  - smoke
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Einstellungen"
# Settings landing — top-level section headers (not nested toggles).
# These four uniquely identify the Settings screen.
- assertVisible: "Anzeige"
- assertVisible: "Board-Einstellungen"
- assertVisible: "Kilter Board Account"
- assertVisible: "Datenverwaltung"
- pressKey: Back
- assertVisible: "Filter"
