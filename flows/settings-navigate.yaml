appId: com.cruxcoach.android
name: settings-navigate
tags:
  - release-gate
  - smoke
---
- runFlow: subflows/launch-browser.yaml
- tapOn:
    id: "board_settings_button"
# Settings landing — traverse stable top-level section anchors across the
# complete scrollable screen without expanding or mutating any section.
- assertVisible:
    id: "settings_section_display"
- scrollUntilVisible:
    element:
      id: "settings_section_board"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "settings_section_kilter"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "settings_section_data"
    direction: DOWN
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
