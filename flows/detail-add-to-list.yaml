appId: com.cruxcoach.android
name: detail-add-to-list
tags:
  - release-gate
  - smoke
  - mutates-state
---
# BEHAVIOUR test: add-to-list pipeline. Open a climb detail, open
# the Add-to-list dialog, toggle the climb into the built-in
# "Favoriten" list, confirm, navigate to Lists screen, verify
# "Favoriten" still listed (round-trip render).
#
# Idempotency: the flow first establishes favorite-off, toggles the climb INTO
# Favoriten through the dialog, then back OUT before exiting. Catches
# regressions in:
# - showAddToListDialog wiring on detail screen
# - dialog rendering with the user's lists
# - ToggleClimbInList write to DB
# - list-detail re-render after toggle
#
# FILTER-STATE precondition: defaults. The flow itself doesn't touch
# any filter; it just navigates from Browser → Detail → Add-to-list
# dialog → close → Browser → Lists.
- runFlow: subflows/open-first-climb.yaml
- copyTextFrom:
    id: "boarddetail_name"
- evalScript: ${output.addToListTarget = maestro.copiedText}
- runFlow:
    when:
      visible: "Von Favoriten entfernen"
    commands:
      - tapOn:
          id: "boarddetail_favorite_button"
- assertVisible: "Zu Favoriten hinzufügen"
# Open Add-to-list dialog from detail TopBar.
- tapOn:
    id: "boarddetail_add_to_list_button"
- assertVisible:
    id: "add_to_list_dialog"
- assertVisible:
    id: "add_to_list_favorites_checkbox"
    checked: false
- tapOn:
    id: "add_to_list_favorites_checkbox"
- assertVisible:
    id: "add_to_list_favorites_checkbox"
    checked: true
- tapOn:
    id: "add_to_list_done"
- assertVisible: "Von Favoriten entfernen"
# After dialog close we're back on Detail. Navigate to Lists.
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
- tapOn:
    id: "board_lists_button"
- assertVisible: "Favoriten"
- tapOn: "Favoriten"
- extendedWaitUntil:
    visible: ${output.addToListTarget}
    timeout: 15000
- assertVisible:
    id: "board_list_entry_card"
- pressKey: Back
- assertVisible: "Favoriten"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
# Cleanup through the same dialog path and verify detail state refresh.
- tapOn:
    id: "board_climb_card"
    index: 0
- extendedWaitUntil:
    visible: ${output.addToListTarget}
    timeout: 15000
- tapOn:
    id: "boarddetail_add_to_list_button"
- assertVisible:
    id: "add_to_list_favorites_checkbox"
    checked: true
- tapOn:
    id: "add_to_list_favorites_checkbox"
- tapOn:
    id: "add_to_list_done"
- assertVisible: "Zu Favoriten hinzufügen"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
