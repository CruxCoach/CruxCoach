appId: com.cruxcoach.android
name: browser-filter-sheet
tags:
  - release-gate
  - smoke
---
# Render/navigation smoke for the complete scrollable filter screen. Dedicated
# roots exercise filter mutations; this root verifies stable UI anchors from
# the top through the bottom without changing persisted filter state.
- runFlow: subflows/launch-browser.yaml
- tapOn:
    id: "board_filter_toggle"
- assertVisible:
    id: "board_filter_reset"
- assertVisible:
    id: "board_filter_info"
- assertVisible:
    id: "board_filter_result_count"
- assertVisible:
    id: "board_filter_board_link"
- scrollUntilVisible:
    element:
      id: "board_grade_slider"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "board_filter_ungraded_only"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "board_type_boulder"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "board_status_all"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "board_benchmark_only"
    direction: DOWN
- assertVisible:
    id: "board_my_climbs_only"
- scrollUntilVisible:
    element:
      id: "board_origin_all"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "board_sort_direction"
    direction: DOWN
- assertVisible:
    id: "board_sort_row"
- pressKey: Back
- assertVisible:
    id: "board_filter_toggle"
- assertVisible:
    id: "board_create_fab"
