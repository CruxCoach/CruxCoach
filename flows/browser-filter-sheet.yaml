appId: com.cruxcoach.android
name: browser-filter-sheet
tags:
  - smoke
---
# Smoke-render check for the filter screen: navigates from Browser →
# Filter, asserts all major sections are present, returns. The actual
# filter LOGIC (e.g. myClimbsOnly persistence, status-filter
# application) is covered by JVM tests in BrowserOriginFilterTest +
# upcoming UserPreferences round-trip tests. This flow's value is
# strictly UI-side: catches "filter screen fails to compose",
# "section header string drift", "back-nav broken".
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Filter"
- assertVisible: "Sortierung"
- assertVisible: "Status"
- assertVisible: "Quelle"
- assertVisible: "Eigene Climbs"
- assertVisible: "Nur Benchmarks"
- pressKey: Back
- assertVisible: "Filter"
- assertVisible: "Neuen Climb erstellen"
