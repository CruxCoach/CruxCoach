name: Release

on:
  push:
    branches: [main, dev]
    # A release is an APK build, a tag and a Zapstore publish. Commits that
    # cannot change the artefact must not start one — a README fix used to
    # be enough to fire the whole pipeline, which is why documentation ends
    # up bundled into release branches instead of landing on its own.
    # Note the semantics: this skips a push only when *every* changed file
    # matches, so a real release commit still triggers even though it also
    # touches the changelog.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run unit tests BEFORE anything else (signing config copy, APK build,
      # publish) so a regression hard-stops the release pipeline. Pre-fix
      # the workflow built + published without exercising any of the 38
      # existing tests, so a broken Schnorr-verify gate or dataKey-unwrap
      # could ship to Zapstore unnoticed. Tests don't need any secrets, so
      # this step runs in a clean checkout.
      - name: Run unit tests
        run: |
          ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' androidApp/build.gradle.kts | head -1 | grep -Po '"\K[^"]+')
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="v${VERSION_NAME}-dev.${SHORT_SHA}"
            RELEASE_NAME="v${VERSION_NAME}-dev (${SHORT_SHA})"
            PRERELEASE=true
          else
            TAG_NAME="v${VERSION_NAME}"
            RELEASE_NAME="v${VERSION_NAME}"
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION_NAME"
            echo "tag=$TAG_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "prerelease=$PRERELEASE"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

          # On main: skip if tag already exists. On dev: always build.
          if [ "$BRANCH" = "main" ] && git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG_NAME already exists — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New release: $RELEASE_NAME"
          fi

      - name: Copy signing config
        if: steps.version.outputs.skip == 'false'
        run: |
          : "${CRUXCOACH_SECRETS_DIR:?CRUXCOACH_SECRETS_DIR must be set on the runner — see CONTRIBUTING.md 'Releases & CI (maintainer only)'}"
          cp "$CRUXCOACH_SECRETS_DIR/local.properties" local.properties
          cp -r "$CRUXCOACH_SECRETS_DIR/.signing" .signing

      - name: Build release APK
        if: steps.version.outputs.skip == 'false'
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          METRICS_ARGS=()
          if [ "$REPOSITORY_SLUG" = "CruxCoach/CruxCoach" ]; then
            METRICS_ARGS+=("-PANONYMOUS_METRICS_ENDPOINT=https://stats.cruxcoach.org/v1/app-event")
          fi
          ./gradlew :androidApp:assembleRelease "${METRICS_ARGS[@]}"

      # Apply a signing-certificate lineage, if one has been provisioned.
      #
      # Inert until the rotation: with no lineage.bin present this step does
      # nothing and the APK keeps AGP's signature. It exists now so the
      # rotation release does not have to invent a signing pipeline under
      # time pressure — AGP has no lineage DSL, so re-signing with apksigner
      # is the only way to produce a rotated APK that installs over an
      # existing one. See docs/KEY_ROTATION.md.
      - name: Apply signing lineage (rotation only)
        if: steps.version.outputs.skip == 'false'
        run: |
          : "${CRUXCOACH_SECRETS_DIR:?CRUXCOACH_SECRETS_DIR must be set on the runner}"
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be set on the runner}"
          LINEAGE="$CRUXCOACH_SECRETS_DIR/lineage.bin"
          if [ ! -f "$LINEAGE" ]; then
            echo "No lineage.bin — not a rotation build, keeping AGP signature"
            exit 0
          fi
          for f in old.jks old-ks-pass.txt old-key-pass.txt old-key-alias.txt \
                   new.jks new-ks-pass.txt new-key-pass.txt new-key-alias.txt \
                   rotation-min-sdk.txt; do
            [ -f "$CRUXCOACH_SECRETS_DIR/$f" ] || { echo "::error::lineage.bin present but $f missing"; exit 1; }
          done
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 \
            -type f -name apksigner -print | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools/"; exit 1; }
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          # BOTH signers are required. Signing with only the new key plus a
          # lineage fails outright while v1 is enabled:
          #   "v1 signing enabled but the oldest signer in the
          #    SigningCertificateLineage is missing"
          # The old key signs v1/v2 (consumed by devices below the rotation
          # boundary), the new key signs v3 — that split is what makes the
          # rotation seamless. Verified against apksigner 36.0.0.
          # Passwords via file: so they never appear in the process list.
          "$APKSIGNER" sign \
            --ks "$CRUXCOACH_SECRETS_DIR/old.jks" \
            --ks-key-alias "$(cat "$CRUXCOACH_SECRETS_DIR/old-key-alias.txt")" \
            --ks-pass "file:$CRUXCOACH_SECRETS_DIR/old-ks-pass.txt" \
            --key-pass "file:$CRUXCOACH_SECRETS_DIR/old-key-pass.txt" \
            --next-signer \
            --ks "$CRUXCOACH_SECRETS_DIR/new.jks" \
            --ks-key-alias "$(cat "$CRUXCOACH_SECRETS_DIR/new-key-alias.txt")" \
            --ks-pass "file:$CRUXCOACH_SECRETS_DIR/new-ks-pass.txt" \
            --key-pass "file:$CRUXCOACH_SECRETS_DIR/new-key-pass.txt" \
            --lineage "$LINEAGE" \
            --rotation-min-sdk-version "$(cat "$CRUXCOACH_SECRETS_DIR/rotation-min-sdk.txt")" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"
          echo "Re-signed with rotated key + lineage"

      - name: Verify APK signature
        if: steps.version.outputs.skip == 'false'
        run: |
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be set on the runner}"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 \
            -type f -name apksigner -print | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools/"; exit 1; }
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          OUT=$("$APKSIGNER" verify --print-certs -v "$APK") || exit 1
          echo "$OUT"

          # v3 carries the SigningCertificateLineage. Without it a future key
          # rotation cannot be installed by anyone, and the failure would only
          # surface during the rotation itself — far too late. A config
          # regression that silently drops v3 must break the build here.
          echo "$OUT" | grep -q "^Verified using v3 scheme (APK Signature Scheme v3): true$" \
            || { echo "::error::v3 signing is OFF — key rotation would be impossible. See androidApp/build.gradle.kts signingConfigs."; exit 1; }

          # Pin the expected signer so a wrong keystore on the runner cannot
          # ship silently. On a deliberate rotation, update EXPECTED_SIGNERS
          # in the same commit that provisions lineage.bin.
          EXPECTED_SIGNERS="7f8308e8fe25e41aad0c7f0ac087775acd7d8c6a23da3a824212a8f3fe1bc2c4"
          MATCHED=0
          for want in $EXPECTED_SIGNERS; do
            echo "$OUT" | grep -qi "certificate SHA-256 digest: $want" && MATCHED=1
          done
          [ "$MATCHED" = "1" ] \
            || { echo "::error::APK signer is not in EXPECTED_SIGNERS — refusing to publish."; exit 1; }

          echo "APK verified successfully (v3 on, signer as expected)"

      - name: Delete old dev release
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.branch == 'dev'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          API="https://codeberg.org/api/v1/repos/CruxCoach/CruxCoach"

          # Delete existing dev releases (by tag pattern, regardless of prerelease flag)
          RELEASES=$(curl -s -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/releases?limit=50")
          echo "$RELEASES" | sed 's/},{/}\n{/g' | while read -r entry; do
            OLD_TAG=$(echo "$entry" | sed -n 's/.*"tag_name":"\([^"]*\)".*/\1/p')
            echo "$OLD_TAG" | grep -q '\-dev\.' || continue
            OLD_ID=$(echo "$entry" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
            DEL_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/releases/${OLD_ID}")
            echo "Deleted dev release: $OLD_TAG (ID: $OLD_ID) → $DEL_CODE"
            TAG_DEL=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags/${OLD_TAG}")
            echo "Deleted tag: $OLD_TAG → $TAG_DEL"
          done

          # Clean up orphan dev tags (from previous failed runs)
          TAGS=$(curl -s -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags?limit=50")
          echo "$TAGS" | sed 's/},{/}\n{/g' | while read -r entry; do
            OLD_TAG=$(echo "$entry" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
            echo "$OLD_TAG" | grep -q '\-dev\.' || continue
            TAG_DEL=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags/${OLD_TAG}")
            echo "Deleted orphan dev tag: $OLD_TAG → $TAG_DEL"
          done
          echo "Cleanup done"

      - name: Create Codeberg release
        if: steps.version.outputs.skip == 'false'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.release_name }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          API="https://codeberg.org/api/v1/repos/CruxCoach/CruxCoach"

          # Sanitize prerelease to valid JSON bool
          case "$PRERELEASE" in true|false) ;; *) PRERELEASE=false ;; esac

          # Push tag via git
          git config user.name "CruxCoach CI"
          git config user.email "ci@cruxcoach.local"
          REMOTE_URL="https://x-access-token:${CODEBERG_TOKEN}@codeberg.org/CruxCoach/CruxCoach.git"
          # Delete tag if it exists (from a previous failed run)
          git tag -d "$TAG" 2>/dev/null || true
          git push "$REMOTE_URL" ":refs/tags/$TAG" 2>/dev/null || true
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/tags/${TAG}"
          git tag "$TAG"
          git push "$REMOTE_URL" "$TAG"

          # Create release via minimal POST + PATCH (full POST triggers
          # intermittent Forgejo 500). Retry on transient failures.
          for ATTEMPT in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -X POST "${API}/releases" \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\"}")
            [ "$HTTP_CODE" = "201" ] && break
            sleep 3
          done
          [ "$HTTP_CODE" = "201" ] || { cat /tmp/release.json; exit 1; }

          RELEASE_ID=$(grep -o '"id":[0-9]*' /tmp/release.json | head -1 | grep -o '[0-9]*')

          # Set name, body, and prerelease flag
          PATCH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X PATCH "${API}/releases/${RELEASE_ID}" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"name":"%s","body":"Release %s","prerelease":%s}' \
              "$NAME" "$NAME" "$PRERELEASE")")
          [ "$PATCH_CODE" = "200" ] || { echo "PATCH failed: $PATCH_CODE"; exit 1; }

          # Generate SHA-256 sidecar in coreutils `sha256sum` format.
          # Required by in-app UpdateChecker (rejects releases without .apk.sha256).
          SHA_FILE="${APK}.sha256"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")

          # Upload SHA-256 sidecar FIRST, then the APK. The updater ignores a
          # release unless BOTH assets exist, so a job that dies between the
          # two uploads must not leave the deceptive state "APK present,
          # sidecar missing" — that looks complete to a human but is invisible
          # to every in-app updater, and the existing tag stops CI from
          # rebuilding it. With the tiny sidecar first, the long risky APK
          # upload is the last step: if it fails, the run is red and the
          # release is obviously incomplete. Both uploads retry transient
          # failures like the release POST above.
          upload_asset() {
            local FILE="$1" FILENAME="$2" CODE
            for ATTEMPT in 1 2 3; do
              CODE=$(curl -sS -o /tmp/asset_upload.json -w '%{http_code}' -X POST \
                -H "Authorization: token ${CODEBERG_TOKEN}" \
                -F "attachment=@${FILE};filename=${FILENAME}" \
                "${API}/releases/${RELEASE_ID}/assets")
              [ "$CODE" = "201" ] && return 0
              echo "Upload of ${FILENAME} failed (attempt ${ATTEMPT}): ${CODE}"
              cat /tmp/asset_upload.json
              sleep 3
            done
            return 1
          }
          upload_asset "$SHA_FILE" "CruxCoach-${TAG}.apk.sha256" || exit 1
          upload_asset "$APK" "CruxCoach-${TAG}.apk" || exit 1

          # Post-verify: read the release back and require BOTH asset names.
          # Catches every remaining partial-upload path loudly instead of
          # shipping a release the updater silently rejects.
          ASSETS=$(curl -sS -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/releases/${RELEASE_ID}" | grep -o '"name":"[^"]*"')
          echo "$ASSETS" | grep -q "CruxCoach-${TAG}.apk\"" \
            || { echo "Post-verify: APK asset missing"; exit 1; }
          echo "$ASSETS" | grep -q "CruxCoach-${TAG}.apk.sha256" \
            || { echo "Post-verify: sha256 sidecar missing"; exit 1; }

          echo "Release $NAME published with APK + SHA-256 sidecar (verified)"

      # A previous run may have completed Codeberg and then failed while
      # publishing the mirror. Re-use that exact tagged APK so a retry can
      # repair Zapstore without rebuilding different bytes under the same
      # version number.
      - name: Prepare existing release for Zapstore repair
        if: steps.version.outputs.skip == 'true' && steps.version.outputs.branch == 'main'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          BASE="https://codeberg.org/CruxCoach/CruxCoach/releases/download/${TAG}"
          mkdir -p "$(dirname "$APK")"

          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            "${BASE}/CruxCoach-${TAG}.apk" --output "$APK"
          EXPECTED_SHA=$(curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${BASE}/CruxCoach-${TAG}.apk.sha256" | awk '/^[0-9a-fA-F]{64}/ { print tolower($1); exit }')
          ACTUAL_SHA=$(sha256sum "$APK" | awk '{ print $1 }')
          if [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Existing Codeberg APK does not match its SHA-256 sidecar"
            exit 1
          fi

          # zsp reads these files from the checkout. Use the tagged metadata,
          # not potentially newer unreleased text from the current main commit.
          git show "${TAG}:zapstore.yaml" > zapstore.yaml
          git show "${TAG}:RELEASE_NOTES.md" > RELEASE_NOTES.md

      - name: Ensure verified Zapstore APK fallback
        if: steps.version.outputs.branch == 'main'
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          [ -s "$APK" ] || { echo "::error::Release APK is missing"; exit 1; }
          APK_SHA=$(sha256sum "$APK" | awk '{ print $1 }')
          APK_SIZE=$(stat -c '%s' "$APK")
          CDN_URL="https://cdn.zapstore.dev/${APK_SHA}"
          CDN_APK=$(mktemp)
          trap 'rm -f .env "$CDN_APK"' EXIT

          verify_cdn_apk() {
            rm -f "$CDN_APK"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 \
              "$CDN_URL" --output "$CDN_APK" || return 1
            [ "$(stat -c '%s' "$CDN_APK")" = "$APK_SIZE" ] || return 1
            printf '%s  %s\n' "$APK_SHA" "$CDN_APK" | sha256sum --check --status
          }

          if verify_cdn_apk; then
            echo "Zapstore CDN already contains the exact release APK"
            exit 0
          fi

          : "${CRUXCOACH_SECRETS_DIR:?CRUXCOACH_SECRETS_DIR must be set on the runner}"
          cp "$CRUXCOACH_SECRETS_DIR/.env" .env
          PUBLISHED=false
          for ATTEMPT in 1 2 3; do
            echo "Zapstore publish attempt $ATTEMPT/3..."
            if timeout 120 zsp publish --skip-preview --skip-certificate-linking --quiet; then
              PUBLISHED=true
              break
            fi
            echo "Attempt $ATTEMPT failed (timeout or error), retrying in 10s..."
            sleep 10
          done
          [ "$PUBLISHED" = true ] \
            || { echo "::error::Zapstore publish failed after 3 attempts"; exit 1; }

          # CDN publication can lag behind the signed Nostr event. Do not mark
          # the release green until the fallback actually serves identical bytes.
          for ATTEMPT in 1 2 3 4 5 6; do
            if verify_cdn_apk; then
              echo "Zapstore fallback verified: ${CDN_URL} (${APK_SIZE} bytes)"
              exit 0
            fi
            echo "Waiting for Zapstore CDN propagation ($ATTEMPT/6)..."
            sleep 10
          done
          echo "::error::Zapstore CDN did not serve the verified release APK"
          exit 1

      # Until now a release reached the website only at the next nightly cron:
      # for up to a day cruxcoach.org advertised the previous version, and the
      # download selector served an APK nobody had been told about. The runner
      # is on the same host as the download server and already holds the exact
      # release bytes, so both halves belong here, at the moment they are true.
      #
      # Neither half is allowed to fail the release. The release itself is
      # already published and immutable at this point; the nightly refresh runs
      # the same script and repairs whatever did not work. A warning is the
      # right volume — loud enough to notice, not loud enough to undo a release.
      - name: Publish the release to the download server and the website
        if: steps.version.outputs.branch == 'main'
        run: |
          set -uo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          APK_DIR="${CRUXCOACH_APK_LOCAL_DIR:-$HOME/cruxcoach-dlstats/apk}"
          PAGES_DIR="${CRUXCOACH_PAGES_DIR:-$HOME/cruxcoach-pages}"

          # These bytes were signature-verified and published a few steps ago,
          # so the selector's copy is a file copy — no download, no digest race
          # against a CDN that may still be propagating. Staged next to the
          # target and moved into place, so a concurrent read never catches a
          # half-written APK.
          if mkdir -p "$APK_DIR"; then
            TMP="$APK_DIR/.CruxCoach-v${VERSION}.apk.tmp"
            if cp "$APK" "$TMP" && chmod 0644 "$TMP" \
               && mv -f "$TMP" "$APK_DIR/CruxCoach-v${VERSION}.apk"; then
              echo "Local APK copy installed: $APK_DIR/CruxCoach-v${VERSION}.apk"
            else
              rm -f "$TMP"
              echo "::warning::Could not install the local APK copy — the selector falls back to Codeberg"
            fi
          fi

          # Download links, JSON-LD, llms.txt, sitemap and the selector
          # manifest. The same script the nightly refresh runs, deliberately:
          # one publishing path, exercised on every release rather than only
          # in the dark.
          if [ -x "$PAGES_DIR/tools/publish-release.sh" ]; then
            (cd "$PAGES_DIR" && ./tools/publish-release.sh) \
              || echo "::warning::Website publish failed — the nightly refresh will retry"
          else
            echo "::warning::$PAGES_DIR/tools/publish-release.sh is missing — website not updated"
          fi
