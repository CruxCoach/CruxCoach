name: Release

on:
  push:
    branches: [main, dev]

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout
        # Resolve the release tag and update this full SHA + comment together.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Scan tracked files for secrets
        run: ./scripts/check_secrets.sh

      # Run unit tests BEFORE anything else (signing config copy, APK build,
      # publish) so a regression hard-stops the release pipeline. Pre-fix
      # the workflow built + published without exercising any of the 38
      # existing tests, so a broken Schnorr-verify gate or dataKey-unwrap
      # could ship to Zapstore unnoticed. Tests don't need any secrets, so
      # this step runs in a clean checkout.
      - name: Run unit tests
        run: |
          ./gradlew :shared:verifySqlDelightMigration \
            :shared:testDebugUnitTest :androidApp:testDebugUnitTest --console=plain

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' androidApp/build.gradle.kts | head -1 | grep -Po '"\K[^"]+')
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="v${VERSION_NAME}-dev.${SHORT_SHA}"
            RELEASE_NAME="v${VERSION_NAME}-dev (${SHORT_SHA})"
            PRERELEASE=true
          else
            TAG_NAME="v${VERSION_NAME}"
            RELEASE_NAME="v${VERSION_NAME}"
            PRERELEASE=false
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # On main: skip if tag already exists. On dev: always build.
          if [ "$BRANCH" = "main" ] && git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG_NAME already exists — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New release: $RELEASE_NAME"
          fi

      - name: Build release APK
        if: steps.version.outputs.skip == 'false'
        run: |
          : "${CRUXCOACH_SECRETS_DIR:?CRUXCOACH_SECRETS_DIR must be set on the runner — see CONTRIBUTING.md 'Releases & CI (maintainer only)'}"
          ./gradlew :androidApp:assembleRelease \
            -PlocalPropertiesFile="$CRUXCOACH_SECRETS_DIR/local.properties"

      - name: Verify APK signature
        if: steps.version.outputs.skip == 'false'
        run: |
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be set on the runner}"
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools/"; exit 1; }
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          ACTUAL=$(echo "$CERTS" | awk -F ': ' '/certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d ':[:space:]' < release-cert-sha256.txt | tr 'A-F' 'a-f')
          echo "$ACTUAL" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::could not extract APK signer SHA-256"; exit 1; }
          echo "$EXPECTED" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::invalid release-cert-sha256.txt"; exit 1; }
          [ "$ACTUAL" = "$EXPECTED" ] \
            || { echo "::error::APK signer does not match release-cert-sha256.txt"; exit 1; }
          echo "APK signature is valid and signer fingerprint matches"

      - name: Publish to Zapstore
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.branch == 'main'
        continue-on-error: true
        id: zapstore
        run: |
          : "${CRUXCOACH_SECRETS_DIR:?CRUXCOACH_SECRETS_DIR must be set on the runner}"
          cp "$CRUXCOACH_SECRETS_DIR/.env" .env
          for ATTEMPT in 1 2 3; do
            echo "Zapstore publish attempt $ATTEMPT/3..."
            if timeout 120 zsp publish --skip-preview --skip-certificate-linking --quiet; then
              echo "Zapstore publish succeeded"
              exit 0
            fi
            echo "Attempt $ATTEMPT failed (timeout or error), retrying in 10s..."
            sleep 10
          done
          echo "::error::Zapstore publish failed after 3 attempts"
          exit 1

      - name: Delete old dev release
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.branch == 'dev'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          : "${GITHUB_SERVER_URL:?GITHUB_SERVER_URL must be set by Forgejo}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set by Forgejo}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Delete existing dev releases (by tag pattern, regardless of prerelease flag)
          RELEASES=$(curl -s -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/releases?limit=50")
          echo "$RELEASES" | sed 's/},{/}\n{/g' | while read -r entry; do
            OLD_TAG=$(echo "$entry" | sed -n 's/.*"tag_name":"\([^"]*\)".*/\1/p')
            echo "$OLD_TAG" | grep -q '\-dev\.' || continue
            OLD_ID=$(echo "$entry" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
            DEL_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/releases/${OLD_ID}")
            echo "Deleted dev release: $OLD_TAG (ID: $OLD_ID) → $DEL_CODE"
            TAG_DEL=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags/${OLD_TAG}")
            echo "Deleted tag: $OLD_TAG → $TAG_DEL"
          done

          # Clean up orphan dev tags (from previous failed runs)
          TAGS=$(curl -s -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags?limit=50")
          echo "$TAGS" | sed 's/},{/}\n{/g' | while read -r entry; do
            OLD_TAG=$(echo "$entry" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
            echo "$OLD_TAG" | grep -q '\-dev\.' || continue
            TAG_DEL=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token ${CODEBERG_TOKEN}" "${API}/tags/${OLD_TAG}")
            echo "Deleted orphan dev tag: $OLD_TAG → $TAG_DEL"
          done
          echo "Cleanup done"

      - name: Create Codeberg release
        if: steps.version.outputs.skip == 'false'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.release_name }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          BRANCH="${{ steps.version.outputs.branch }}"
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          : "${GITHUB_SERVER_URL:?GITHUB_SERVER_URL must be set by Forgejo}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set by Forgejo}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          REMOTE_URL="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          # Sanitize prerelease to valid JSON bool
          case "$PRERELEASE" in true|false) ;; *) PRERELEASE=false ;; esac

          # Push tag via git
          git config user.name "CruxCoach CI"
          git config user.email "ci@cruxcoach.local"
          AUTH_B64=$(printf 'x-access-token:%s' "$CODEBERG_TOKEN" | base64 | tr -d '\n')
          git_push() {
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: Basic ${AUTH_B64}" \
              git push "$REMOTE_URL" "$@"
          }
          # Delete tag if it exists (from a previous failed run)
          git tag -d "$TAG" 2>/dev/null || true
          git_push ":refs/tags/$TAG" 2>/dev/null || true
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/tags/${TAG}"
          git tag "$TAG"
          git_push "$TAG"

          # Create release via minimal POST + PATCH (full POST triggers
          # intermittent Forgejo 500). Retry on transient failures.
          for ATTEMPT in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -X POST "${API}/releases" \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\"}")
            [ "$HTTP_CODE" = "201" ] && break
            sleep 3
          done
          [ "$HTTP_CODE" = "201" ] || { cat /tmp/release.json; exit 1; }

          RELEASE_ID=$(grep -o '"id":[0-9]*' /tmp/release.json | head -1 | grep -o '[0-9]*')

          # Set name, body, and prerelease flag
          PATCH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X PATCH "${API}/releases/${RELEASE_ID}" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"name":"%s","body":"Release %s","prerelease":%s}' \
              "$NAME" "$NAME" "$PRERELEASE")")
          [ "$PATCH_CODE" = "200" ] || { echo "PATCH failed: $PATCH_CODE"; exit 1; }

          # Generate SHA-256 sidecar in coreutils `sha256sum` format, naming
          # the uploaded asset so `sha256sum -c` works after download.
          # Required by in-app UpdateChecker (rejects releases without .apk.sha256).
          SHA_FILE="${APK}.sha256"
          APK_ASSET="${REPO_NAME}-${TAG}.apk"
          SHA_ASSET="${APK_ASSET}.sha256"
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf '%s  %s\n' "$APK_SHA" "$APK_ASSET" > "$SHA_FILE"

          # Upload SHA-256 sidecar FIRST, then the APK. The updater ignores a
          # release unless BOTH assets exist, so a job that dies between the
          # two uploads must not leave the deceptive state "APK present,
          # sidecar missing" — that looks complete to a human but is invisible
          # to every in-app updater, and the existing tag stops CI from
          # rebuilding it. With the tiny sidecar first, the long risky APK
          # upload is the last step: if it fails, the run is red and the
          # release is obviously incomplete. Both uploads retry transient
          # failures like the release POST above.
          upload_asset() {
            local FILE="$1" FILENAME="$2" CODE
            for ATTEMPT in 1 2 3; do
              CODE=$(curl -sS -o /tmp/asset_upload.json -w '%{http_code}' -X POST \
                -H "Authorization: token ${CODEBERG_TOKEN}" \
                -F "attachment=@${FILE};filename=${FILENAME}" \
                "${API}/releases/${RELEASE_ID}/assets")
              [ "$CODE" = "201" ] && return 0
              echo "Upload of ${FILENAME} failed (attempt ${ATTEMPT}): ${CODE}"
              cat /tmp/asset_upload.json
              sleep 3
            done
            return 1
          }
          upload_asset "$SHA_FILE" "$SHA_ASSET" || exit 1
          upload_asset "$APK" "$APK_ASSET" || exit 1

          # Post-verify: read the release back and require BOTH asset names.
          # Catches every remaining partial-upload path loudly instead of
          # shipping a release the updater silently rejects.
          ASSETS=$(curl -sS -H "Authorization: token ${CODEBERG_TOKEN}" \
            "${API}/releases/${RELEASE_ID}" | grep -o '"name":"[^"]*"')
          echo "$ASSETS" | grep -Fq "${APK_ASSET}\"" \
            || { echo "Post-verify: APK asset missing"; exit 1; }
          echo "$ASSETS" | grep -Fq "$SHA_ASSET" \
            || { echo "Post-verify: sha256 sidecar missing"; exit 1; }

          echo "Release $NAME published with APK + SHA-256 sidecar (verified)"

      - name: Remove credentials from workspace
        if: always()
        run: |
          rm -f -- local.properties .env /tmp/release.json /tmp/asset_upload.json
          rm -rf -- .signing
          for PATH_TO_CHECK in local.properties .env .signing; do
            [ ! -e "$PATH_TO_CHECK" ] \
              || { echo "::error::credential path survived cleanup: $PATH_TO_CHECK"; exit 1; }
          done
